spring:
  application:
    name: koifolio
  datasource:
    url: jdbc:postgresql://localhost:5432/koifolio
    username: koifolio
    password: ${POSTGRES_PASSWORD}
  jpa:
    open-in-view: false
    hibernate:
      ddl-auto: validate
  mvc:
    problemdetails:
      enabled: true
  servlet:
    multipart:
      max-file-size: 20MB
      max-request-size: 21MB
  ai:
    mcp:
      server:
        name: koifolio
        protocol: STATELESS

management:
  endpoints:
    web:
      exposure:
        include: health

springdoc:
  api-docs:
    enabled: ${KOIFOLIO_SWAGGER:false}
  swagger-ui:
    enabled: ${KOIFOLIO_SWAGGER:false}

koifolio:
  prices:
    schedule-enabled: true
    initial-delay: 1m
    refresh-every: 15m
    refresh-cooldown: 1m
    bankier-url: https://api.bankier.pl/quotes/public
    nbp-url: https://api.nbp.pl/api
  auth:
    jwt-secret: ${KOIFOLIO_JWT_SECRET}
    token-ttl: 12h
